# Self-hosted Moodle 4.5 LTS for the fusion spike. Brought up by up.sh (which
# also fills the fx-moodle-src volume with a shallow Moodle checkout first).
name: fx-moodle
services:
  db:
    image: mirror.gcr.io/library/postgres:16-alpine
    container_name: fx-moodle-db
    environment:
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: ${MOODLE_DB_PASSWORD:?run up.sh}
      POSTGRES_DB: moodle
      TZ: America/Vancouver
    volumes:
      - fx-moodle-pg:/var/lib/postgresql/data
    networks: [fx-moodle-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodle"]
      interval: 3s
      retries: 40
    restart: unless-stopped
  app:
    image: moodlehq/moodle-php-apache:8.3
    container_name: fx-moodle-app
    depends_on:
      db: {condition: service_healthy}
    environment:
      TZ: America/Vancouver
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - fx-moodle-src:/var/www/html
      - fx-moodle-data:/var/www/moodledata
    networks: [fx-moodle-net]
    restart: unless-stopped
volumes:
  fx-moodle-pg: {name: fx-moodle-pg}
  fx-moodle-src: {name: fx-moodle-src, external: true}
  fx-moodle-data: {name: fx-moodle-data}
networks:
  fx-moodle-net: {name: fx-moodle-net}
