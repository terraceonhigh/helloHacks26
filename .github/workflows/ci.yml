name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:                   # ship-on-request: gh workflow run Tests --ref main

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest tests/ -v

  deploy:
    needs: pytest                      # only after tests pass
    # ponytail: ship-on-request only (Terrace, 2026-09-27), because pushes burned the Vercel
    # Hobby daily deploy cap. Upgrade: put `push` back here if we move to Pro.
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:                       # shows the live site under "Deployments" on the repo page
      name: production
      url: https://hello-hacks26-terraceonhigh.vercel.app/
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: astral-sh/setup-uv@v3        # vercel build needs uv for web/api/feed.py's Python deps (#66)
      - run: npx --yes vercel@latest pull --yes --environment=production --token=$VERCEL_TOKEN
      # web/api/feed.py needs hub/ (repo root, outside Vercel's web/ Root
      # Directory). vercel.json's `includeFiles: "../hub/**"` looked right
      # but Vercel rejects any includeFiles path that escapes the Root
      # Directory at deploy time ("invalid file descriptor path"). Copying
      # hub/ to a real sibling directory needs no special Vercel setting.
      - name: Copy hub/ into the Vercel root
        run: cp -r hub web/hub
      - run: npx --yes vercel@latest build --prod --token=$VERCEL_TOKEN
      - run: npx --yes vercel@latest deploy --prebuilt --prod --token=$VERCEL_TOKEN
