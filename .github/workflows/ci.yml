name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest tests/ -v

  js-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies (tests import xlsx)
        run: npm ci
        working-directory: web
      - name: Run JS tests
        run: node --test 'web/lib/*.test.mjs'   # Node 22 reads a bare dir as a module path; use a glob

  deploy:
    needs: [pytest, js-tests]           # only after both test suites pass
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npx --yes vercel@latest pull --yes --environment=production --token=$VERCEL_TOKEN
      - run: npx --yes vercel@latest build --prod --token=$VERCEL_TOKEN
      - run: npx --yes vercel@latest deploy --prebuilt --prod --token=$VERCEL_TOKEN
