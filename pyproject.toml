[project]
name = "ubc-hub"
version = "0.1.0"
description = "Single pane of glass for UBC: Canvas, Workday, and the UBC Bookstore"
requires-python = ">=3.12"
dependencies = [
    "streamlit",
    "requests",
    "beautifulsoup4",
    "openpyxl",
    "icalendar",
    "playwright>=1.63.0",
    "scikit-learn>=1.9.1",
    "joblib>=1.6.0",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
