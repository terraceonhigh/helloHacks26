[project]
name = "lauds"
version = "0.1.0"
description = "Lauds: one CLI for every course deadline (Canvas, PrairieLearn, WeBWorK, Workday, ...)"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "beautifulsoup4",
    "icalendar",
    "openpyxl",
    "playwright",
]

[project.scripts]
lauds = "lauds.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lauds"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/parity"]
pythonpath = ["."]
