<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>UBC Hub Sync</title>
<style>
  body {font: 14px system-ui; width: 300px; padding: 12px;}
  label, input, button {display: block; width: 100%; box-sizing: border-box; margin: 8px 0;}
  input, button {padding: 8px;}
  #status {min-height: 2em; color: #333;}
</style>
<h1>UBC Hub</h1>
<label for="provider">Provider</label>
<select id="provider"></select>
<p id="navNotice" hidden style="font-size:12px;color:#333;">This will navigate this browser tab through each of your courses' assessments list pages to read them.</p>
<label for="origin">Moodle or Blackboard site URL</label>
<input id="origin" type="url" placeholder="https://lms.example.edu">
<label for="key">Hub sync key (when hosted storage is ready)</label>
<input id="key" type="password" autocomplete="off" placeholder="Optional for local capture">
<button id="save">Save key</button>
<button id="sync">Sync selected provider</button>
<p id="status" role="status"></p>
<script src="providers.js"></script>
<script src="popup.js"></script>
</html>
